<header class="header">
  <div class="container nav-wrap">
    <a class="logo" href="{eyou:global name='web_cmsurl' /}" aria-label="LIGUOXING home">
      <img src="{eyou:global name='web_cmsurl' /}/images/logo-liguoxing-header.png" alt="LIGUOXING logo">
      <div>
        <div class="logo-name">LIGUOXING</div>
        <div class="logo-mark">Industrial Equipment</div>
      </div>
    </a>
    <div class="nav-right">
      <nav class="nav" aria-label="Main Navigation">
        <a href="{eyou:global name='web_cmsurl' /}" data-i18n-key="nav.home">Home</a>
        <a href="{eyou:global name='web_cmsurl' /}/about.htm" data-i18n-key="nav.about">About Us</a>
        <div class="nav-dropdown">
          <div class="nav-dropdown-head">
            <a class="nav-link" href="{eyou:global name='web_cmsurl' /}/equipment.htm" data-i18n-key="nav.equipment">Equipment</a>
            <button class="nav-dropdown-toggle" type="button" aria-label="Open equipment menu">▾</button>
          </div>
          <div class="nav-submenu" role="menu" aria-label="Equipment models">
            <a href="{eyou:global name='web_cmsurl' /}/equipment.htm" role="menuitem">BVM-120 Model Block Bottom Valve Bag Making Machine</a>
            <a href="{eyou:global name='web_cmsurl' /}/equipment-sfh-800.htm" role="menuitem">SFH-800 Model Twin Extruder Lamination</a>
            <a href="{eyou:global name='web_cmsurl' /}/equipment-gy-800.htm" role="menuitem">GY-800 Serial Printing Machine</a>
          </div>
        </div>
        <a href="{eyou:global name='web_cmsurl' /}/application.htm" data-i18n-key="nav.applications">Applications</a>
        <a href="{eyou:global name='web_cmsurl' /}/cases.htm" data-i18n-key="nav.cases">Cases</a>
        <a href="{eyou:global name='web_cmsurl' /}/news.htm" data-i18n-key="nav.news">News</a>
        <a href="{eyou:global name='web_cmsurl' /}/contact.htm" data-i18n-key="nav.contact">Contact</a>
        <a href="{eyou:global name='web_cmsurl' /}/download.htm" data-i18n-key="nav.download">Download</a>
      </nav>
      <div class="header-actions">
        <div class="lang-dropdown" data-lang-dropdown>
          <button
            class="lang-toggle"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
            data-lang-toggle
          >
            <span class="globe">o</span>
            <span class="lang-current" data-lang-current>EN</span>
            <span class="lang-caret" aria-hidden="true">▾</span>
          </button>
          <div class="lang-menu" role="listbox" aria-label="Language selector" data-lang-menu>
            <button class="lang-item" type="button" data-set-lang="en" role="option" aria-pressed="false">English</button>
            <button class="lang-item" type="button" data-set-lang="ru" role="option" aria-pressed="false">Русский</button>
            <button class="lang-item" type="button" data-set-lang="es" role="option" aria-pressed="false">Español</button>
          </div>
        </div>
        <a class="btn btn-primary quote-btn" href="{eyou:global name='web_cmsurl' /}/contact.htm" data-i18n-key="header.quote">Get a Quote</a>
      </div>
    </div>
  </div>
</header>
